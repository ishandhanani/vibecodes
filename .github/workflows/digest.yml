name: Daily Digest

on:
    schedule:
        # 8am Pacific = 3pm UTC (PST) or 4pm UTC (PDT)
        # Using 3pm UTC to cover standard time
        - cron: "0 15 * * *"
    workflow_dispatch: # Allow manual trigger

jobs:
    digest:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.23"

            - name: Build digest
              working-directory: ./digest
              run: go build -o digest .

            - name: Run digest
              working-directory: ./digest
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  DIGEST_LOG_LEVEL: info
              run: |
                  ./digest -c config.yaml -o digest-output.md

            - name: Display digest
              working-directory: ./digest
              run: |
                  echo "## 📬 Daily Digest - $(date '+%Y-%m-%d')"
                  echo ""
                  cat digest-output.md

            - name: Upload digest as artifact
              uses: actions/upload-artifact@v4
              with:
                  name: digest-${{ github.run_number }}
                  path: digest/digest-output.md
                  retention-days: 7

            # Future: Slack notification
