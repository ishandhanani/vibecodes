name: Daily Digest

on:
  schedule:
    # 8am Pacific = 3pm UTC (PST) or 4pm UTC (PDT)
    - cron: "0 15 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build digest
        working-directory: ./digest
        run: go build -o digest .

      - name: Run digest
        working-directory: ./digest
        env:
          TOKEN: ${{ secrets.TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DIGEST_LOG_LEVEL: debug
        run: ./digest -c config.yaml -o digest-output.md

      - name: Show digest in job summary
        working-directory: ./digest
        run: |
          echo "## 📬 Daily Digest - $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat digest-output.md >> $GITHUB_STEP_SUMMARY
