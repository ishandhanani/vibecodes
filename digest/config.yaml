# =============================================================================
# digest configuration
# =============================================================================
# Location: ~/.config/digest/config.yaml (default) or use --config flag
#
# REQUIRED ENVIRONMENT VARIABLES:
#   TOKEN               - GitHub personal access token with repo read access
#   OPENROUTER_API_KEY  - OpenRouter API key (optional, for AI analysis)
#
# =============================================================================

user: ishandhanani
days_back: 1

# Global exclusions - topics to deprioritize (AI will give these P1)
exclude:
  - VLM
  - vision model
  - AMD
  - ROCm
  - gfx942
  - Ascend
  - Huawei
  - NPU
  - Intel XPU

repos:
  - name: SGLang
    repo: sgl-project/sglang
    
    # Topics to track - each becomes a section with issues & PRs
    topics:
      - nixl
      - p/d disaggregation
      - prefill/decode
      - tracing
      - metrics
      - dp attention
      - data parallel attention
      - deepseek r1
      - deepseek v3

  - name: Dynamo
    repo: ai-dynamo/dynamo
    
    topics:
      - sglang
    
    # Additional watches (optional)
    watches:
      - type: labeled
        label: external contribution

ai:
  enabled: true
  model: x-ai/grok-4.1-fast
